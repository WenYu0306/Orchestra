services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      # 只绑定本机回环地址：API 无鉴权，绝不能暴露到局域网
      - "127.0.0.1:5001:5001"
    # 密钥通过 env_file 注入，避免 docker inspect 直接读到
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./my_resume.pdf:/app/my_resume.pdf:ro
      - job_data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend

volumes:
  job_data:
